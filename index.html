<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecuador Interactivo - RA</title>
  
  <!-- Librerías de A-Frame y MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    
    /* Panel de navegación por regiones */
    #panel-regiones {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      gap: 10px;
    }

    .btn-region {
      padding: 10px 16px;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.4);
      transition: background 0.3s;
    }

    /* Colores de los botones */
    #btn-costa { background-color: #f39c12; } /* Naranja */
    #btn-sierra { background-color: #e67e22; } /* Rojo-Naranja */
    #btn-amazonia { background-color: #27ae60; } /* Verde */
  </style>
</head>
<body>

  <!-- Panel de navegación -->
  <div id="panel-regiones">
    <button id="btn-costa" class="btn-region">Costa</button>
    <button id="btn-sierra" class="btn-region">Sierra</button>
    <button id="btn-amazonia" class="btn-region">Amazonía</button>
  </div>

  <!-- Escena de Realidad Aumentada -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <!-- Carga de Archivos (Modelos 3D y Audios) -->
    <a-assets>
      <!-- Modelos 3D (.glb) -->
      <a-asset-item id="modelCosta" src="./costa.glb"></a-asset-item>
      <a-asset-item id="modelSierra" src="./sierra.glb"></a-asset-item>
      <a-asset-item id="modelAmazonia" src="./amazonia.glb"></a-asset-item>

      <!-- Audios (.mp3 con mayúscula) -->
      <audio id="audioCosta" src="./Costa.mp3" preload="auto"></audio>
      <audio id="audioSierra" src="./Sierra.mp3" preload="auto"></audio>
      <audio id="audioAmazonia" src="./Amazonia.mp3" preload="auto"></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Objetivo de Imagen (El Mapa) -->
    <a-entity mindar-image-target="targetIndex: 0" id="mapa-target">
      
      <!-- MODELO COSTA (Izquierda) -->
      <a-entity id="entidadCosta"
        gltf-model="#modelCosta" 
        position="-0.4 0 0.1" 
        scale="0.2 0.2 0.2" 
        rotation="90 0 0">
      </a-entity>

      <!-- MODELO SIERRA (Centro - Cóndor/Montaña) -->
      <a-entity id="entidadSierra"
        gltf-model="#modelSierra" 
        position="0 0 0.1" 
        scale="0.2 0.2 0.2" 
        rotation="90 0 0">
      </a-entity>

      <!-- MODELO AMAZONÍA (Derecha) -->
      <a-entity id="entidadAmazonia"
        gltf-model="#modelAmazonia" 
        position="0.4 0 0.1" 
        scale="0.2 0.2 0.2" 
        rotation="90 0 0">
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    // Referencias a los audios
    const audioCosta = document.getElementById('audioCosta');
    const audioSierra = document.getElementById('audioSierra');
    const audioAmazonia = document.getElementById('audioAmazonia');

    // Función para detener todos los audios antes de reproducir uno nuevo
    function detenerTodosAudios() {
      audioCosta.pause();
      audioCosta.currentTime = 0;
      audioSierra.pause();
      audioSierra.currentTime = 0;
      audioAmazonia.pause();
      audioAmazonia.currentTime = 0;
    }

    // Eventos para los botones
    document.getElementById('btn-costa').addEventListener('click', () => {
      detenerTodosAudios();
      audioCosta.play().catch(e => console.log(e));
    });

    document.getElementById('btn-sierra').addEventListener('click', () => {
      detenerTodosAudios();
      audioSierra.play().catch(e => console.log(e));
    });

    document.getElementById('btn-amazonia').addEventListener('click', () => {
      detenerTodosAudios();
      audioAmazonia.play().catch(e => console.log(e));
    });

    // Detener audio si se pierde de vista el mapa
    const target = document.querySelector('#mapa-target');
    target.addEventListener("targetLost", () => {
      detenerTodosAudios();
    });
  </script>
</body>
</html>
