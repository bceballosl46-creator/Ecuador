<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecuador Interactivo - RA</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    
    #panel-regiones {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      gap: 10px;
    }

    .btn-region {
      padding: 12px 18px;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.4);
    }

    #btn-costa { background-color: #f1c40f; color: #333; }
    #btn-sierra { background-color: #a93226; }
    #btn-amazonia { background-color: #27ae60; }
  </style>
</head>
<body>

  <div id="panel-regiones">
    <button id="btn-costa" class="btn-region">Costa</button>
    <button id="btn-sierra" class="btn-region">Sierra</button>
    <button id="btn-amazonia" class="btn-region">Amazonía</button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="modelCosta" src="./costa.glb"></a-asset-item>
      <a-asset-item id="modelSierra" src="./sierra.glb"></a-asset-item>
      <a-asset-item id="modelAmazonia" src="./amazonia.glb"></a-asset-item>

      <audio id="audioCosta" src="./Costa.mp3" preload="auto"></audio>
      <audio id="audioSierra" src="./Sierra.mp3" preload="auto"></audio>
      <audio id="audioAmazonia" src="./Amazonia.mp3" preload="auto"></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="mapa-target">
      
      <!-- COSTA (Ubicado a la izquierda del mapa) -->
      <a-entity id="entidadCosta"
        gltf-model="#modelCosta" 
        position="-0.35 0 0.1" 
        scale="0.2 0.2 0.2" 
        rotation="90 0 0"
        visible="false">
      </a-entity>

      <!-- SIERRA (Ubicado al centro/Cordillera) -->
      <a-entity id="entidadSierra"
        gltf-model="#modelSierra" 
        position="0 0 0.1" 
        scale="0.2 0.2 0.2" 
        rotation="90 0 0"
        visible="false">
      </a-entity>

      <!-- AMAZONÍA (Ubicado a la derecha del mapa) -->
      <a-entity id="entidadAmazonia"
        gltf-model="#modelAmazonia" 
        position="0.35 0 0.1" 
        scale="0.2 0.2 0.2" 
        rotation="90 0 0"
        visible="false">
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const modCosta = document.getElementById('entidadCosta');
    const modSierra = document.getElementById('entidadSierra');
    const modAmazonia = document.getElementById('entidadAmazonia');

    const audCosta = document.getElementById('audioCosta');
    const audSierra = document.getElementById('audioSierra');
    const audAmazonia = document.getElementById('audioAmazonia');

    function resetearTodo() {
      modCosta.setAttribute('visible', 'false');
      modSierra.setAttribute('visible', 'false');
      modAmazonia.setAttribute('visible', 'false');

      audCosta.pause(); audCosta.currentTime = 0;
      audSierra.pause(); audSierra.currentTime = 0;
      audAmazonia.pause(); audAmazonia.currentTime = 0;
    }

    document.getElementById('btn-costa').addEventListener('click', () => {
      resetearTodo();
      modCosta.setAttribute('visible', 'true');
      audCosta.play().catch(e => console.log(e));
    });

    document.getElementById('btn-sierra').addEventListener('click', () => {
      resetearTodo();
      modSierra.setAttribute('visible', 'true');
      audSierra.play().catch(e => console.log(e));
    });

    document.getElementById('btn-amazonia').addEventListener('click', () => {
      resetearTodo();
      modAmazonia.setAttribute('visible', 'true');
      audAmazonia.play().catch(e => console.log(e));
    });

    const target = document.querySelector('#mapa-target');
    target.addEventListener("targetLost", () => {
      resetearTodo();
    });
  </script>
</body>
</html>
