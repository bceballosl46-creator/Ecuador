<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecuador Interactivo - RA</title>
  
  <!-- Librerías de A-Frame y MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    
    /* Panel de navegación flotante */
    #panel-regiones {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      gap: 10px;
    }

    /* Estilo de los botones */
    .btn-region {
      padding: 12px 18px;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.4);
      transition: background 0.3s;
    }

    /* Colores por región */
    #btn-costa { background-color: #f1c40f; color: #333; } /* Amarillo */
    #btn-sierra { background-color: #a93226; }             /* Café/Rojo */
    #btn-amazonia { background-color: #27ae60; }          /* Verde */
  </style>
</head>
<body>

  <!-- Panel de botones -->
  <div id="panel-regiones">
    <button id="btn-costa" class="btn-region">Costa</button>
    <button id="btn-sierra" class="btn-region">Sierra</button>
    <button id="btn-amazonia" class="btn-region">Amazonía</button>
  </div>

  <!-- Escena de Realidad Aumentada -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <!-- Carga de Archivos (Imágenes PNG y Audios MP3) -->
    <a-assets>
      <!-- Imágenes PNG (Importante que coincidan mayúsculas/minúsculas con tu GitHub) -->
      <img id="imgCosta" src="./Costa.png">
      <img id="imgSierra" src="./Sierra.png">
      <img id="imgAmazonia" src="./Amazonia.png">

      <!-- Audios MP3 -->
      <audio id="audioCosta" src="./Costa.mp3" preload="auto"></audio>
      <audio id="audioSierra" src="./Sierra.mp3" preload="auto"></audio>
      <audio id="audioAmazonia" src="./Amazonia.mp3" preload="auto"></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Objetivo de Imagen (El Mapa Físico) -->
    <a-entity mindar-image-target="targetIndex: 0" id="mapa-target">
      
      <!-- IMAGEN COSTA (Flotando a la izquierda) -->
      <a-image id="entidadCosta"
        src="#imgCosta"
        position="-0.35 0 0.1" 
        width="0.7" height="0.8"
        visible="false">
      </a-image>

      <!-- IMAGEN SIERRA (Flotando al centro) -->
      <a-image id="entidadSierra"
        src="#imgSierra"
        position="0 0 0.1" 
        width="0.7" height="0.8"
        visible="false">
      </a-image>

      <!-- IMAGEN AMAZONÍA (Flotando a la derecha) -->
      <a-image id="entidadAmazonia"
        src="#imgAmazonia"
        position="0.35 0 0.1" 
        width="0.7" height="0.8"
        visible="false">
      </a-image>

    </a-entity>
  </a-scene>

  <script>
    // Referencias a los elementos de imagen de A-Frame
    const imgCosta = document.getElementById('entidadCosta');
    const imgSierra = document.getElementById('entidadSierra');
    const imgAmazonia = document.getElementById('entidadAmazonia');

    // Referencias a los elementos de audio
    const audCosta = document.getElementById('audioCosta');
    const audSierra = document.getElementById('audioSierra');
    const audAmazonia = document.getElementById('audioAmazonia');

    // Función para ocultar todas las imágenes y detener todos los audios
    function resetearTodo() {
      imgCosta.setAttribute('visible', 'false');
      imgSierra.setAttribute('visible', 'false');
      imgAmazonia.setAttribute('visible', 'false');

      audCosta.pause(); audCosta.currentTime = 0;
      audSierra.pause(); audSierra.currentTime = 0;
      audAmazonia.pause(); audAmazonia.currentTime = 0;
    }

    // Interacción Botón Costa
    document.getElementById('btn-costa').addEventListener('click', () => {
      resetearTodo();
      imgCosta.setAttribute('visible', 'true'); // Muestra la imagen de la Costa
      audCosta.play().catch(e => console.log(e));  // Reproduce audio Costa
    });

    // Interacción Botón Sierra
    document.getElementById('btn-sierra').addEventListener('click', () => {
      resetearTodo();
      imgSierra.setAttribute('visible', 'true'); // Muestra la imagen de la Sierra
      audSierra.play().catch(e => console.log(e)); // Reproduce audio Sierra
    });

    // Interacción Botón Amazonía
    document.getElementById('btn-amazonia').addEventListener('click', () => {
      resetearTodo();
      imgAmazonia.setAttribute('visible', 'true'); // Muestra la imagen de Amazonía
      audAmazonia.play().catch(e => console.log(e)); // Reproduce audio Amazonía
    });

    // Detener todo si la cámara pierde de vista el mapa
    const target = document.querySelector('#mapa-target');
    target.addEventListener("targetLost", () => {
      resetearTodo();
    });
  </script>
</body>
</html>
