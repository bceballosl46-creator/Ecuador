<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecuador Interactivo - RA</title>
  
  <!-- Librerías de A-Frame y MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- Librería indispensable para reproducir animaciones de archivos .GLB -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    
    /* Panel de botones inferior */
    #panel-regiones {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      gap: 10px;
    }

    .btn-region {
      padding: 12px 18px;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.4);
    }

    #btn-costa { background-color: #f1c40f; color: #333; }
    #btn-sierra { background-color: #a93226; }
    #btn-amazonia { background-color: #27ae60; }
  </style>
</head>
<body>

  <!-- Panel de botones -->
  <div id="panel-regiones">
    <button id="btn-costa" class="btn-region">Costa</button>
    <button id="btn-sierra" class="btn-region">Sierra</button>
    <button id="btn-amazonia" class="btn-region">Amazonía</button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Personas (Imágenes PNG) -->
      <img id="imgCosta" src="./Costa.png">
      <img id="imgSierra" src="./Sierra.png">
      <img id="imgAmazonia" src="./Amazonia.png">

      <!-- Animales (Modelos 3D .GLB) -->
      <a-asset-item id="glbCosta" src="./costa.glb"></a-asset-item>
      <a-asset-item id="glbSierra" src="./sierra.glb"></a-asset-item>
      <a-asset-item id="glbAmazonia" src="./amazonia.glb"></a-asset-item>

      <!-- Audios MP3 -->
      <audio id="audioCosta" src="./Costa.mp3" preload="auto"></audio>
      <audio id="audioSierra" src="./Sierra.mp3" preload="auto"></audio>
      <audio id="audioAmazonia" src="./Amazonia.mp3" preload="auto"></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target del Mapa Físico -->
    <a-entity mindar-image-target="targetIndex: 0" id="mapa-target">
      
      <!-- GRUPO COSTA (Persona PNG + Animal 3D GLB) -->
      <a-entity id="grupoCosta" visible="false">
        <!-- Persona Costa a la izquierda -->
        <a-image src="#imgCosta" position="-0.4 0 0.1" width="0.5" height="0.65"></a-image>
        <!-- Animal Costa 3D a la derecha con animación -->
        <a-entity gltf-model="#glbCosta" animation-mixer position="0.1 -0.1 0.1" scale="0.3 0.3 0.3" rotation="0 0 0"></a-entity>
      </a-entity>

      <!-- GRUPO SIERRA (Persona PNG + Animal 3D GLB) -->
      <a-entity id="grupoSierra" visible="false">
        <!-- Persona Sierra a la izquierda -->
        <a-image src="#imgSierra" position="-0.3 0 0.1" width="0.5" height="0.65"></a-image>
        <!-- Animal Sierra 3D a la derecha con animación -->
        <a-entity gltf-model="#glbSierra" animation-mixer position="0.2 0 0.1" scale="0.3 0.3 0.3" rotation="0 0 0"></a-entity>
      </a-entity>

      <!-- GRUPO AMAZONÍA (Persona PNG + Animal 3D GLB) -->
      <a-entity id="grupoAmazonia" visible="false">
        <!-- Persona Amazonía a la izquierda -->
        <a-image src="#imgAmazonia" position="-0.3 0 0.1" width="0.5" height="0.65"></a-image>
        <!-- Animal Amazonía 3D a la derecha con animación -->
        <a-entity gltf-model="#glbAmazonia" animation-mixer position="0.25 -0.1 0.1" scale="0.3 0.3 0.3" rotation="0 0 0"></a-entity>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    // Referencias a los grupos que contienen Persona + Animal
    const grupoCosta = document.getElementById('grupoCosta');
    const grupoSierra = document.getElementById('grupoSierra');
    const grupoAmazonia = document.getElementById('grupoAmazonia');

    // Referencias a los Audios
    const audCosta = document.getElementById('audioCosta');
    const audSierra = document.getElementById('audioSierra');
    const audAmazonia = document.getElementById('audioAmazonia');

    // Apagar todo
    function resetearTodo() {
      grupoCosta.setAttribute('visible', 'false');
      grupoSierra.setAttribute('visible', 'false');
      grupoAmazonia.setAttribute('visible', 'false');

      audCosta.pause(); audCosta.currentTime = 0;
      audSierra.pause(); audSierra.currentTime = 0;
      audAmazonia.pause(); audAmazonia.currentTime = 0;
    }

    // Eventos de Click en Botones
    document.getElementById('btn-costa').addEventListener('click', () => {
      resetearTodo();
      grupoCosta.setAttribute('visible', 'true');
      audCosta.play().catch(e => console.log(e));
    });

    document.getElementById('btn-sierra').addEventListener('click', () => {
      resetearTodo();
      grupoSierra.setAttribute('visible', 'true');
      audSierra.play().catch(e => console.log(e));
    });

    document.getElementById('btn-amazonia').addEventListener('click', () => {
      resetearTodo();
      grupoAmazonia.setAttribute('visible', 'true');
      audAmazonia.play().catch(e => console.log(e));
    });

    // Ocultar si la cámara pierde el objetivo
    const target = document.querySelector('#mapa-target');
    target.addEventListener("targetLost", () => {
      resetearTodo();
    });
  </script>
</body>
</html>
